[package]
name = 'stringrs'
version = '0.1.0'
edition = '2021'
rust-version = "1.80"  # Required for LazyLock

[lib]
crate-type = [ 'staticlib' ]
name = 'stringrs'

[dependencies]
extendr-api = '*'
# Standard regex crate - faster, no backrefs/lookaheads
regex = "1.10"
# Fancy regex - supports backrefs and lookaheads, slower
fancy-regex = "0.14.0"
rayon = "1.10.0"
dhat = { version = "0.3.2", optional = true }

[features]
default = []
profile-memory = ["dhat"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3.2"
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }
rand = { version = "0.8", features = ["std_rng"] }

[[bench]]
name = "regex_ops"
harness = false

[[bench]]
name = "cache_behavior"
harness = false

[[bench]]
name = "parallel_scaling"
harness = false

# EXTREME optimization profile
[profile.release]
# Maximum optimization
opt-level = 3
# Full link-time optimization across all crates
lto = "fat"
# Single codegen unit for maximum optimization
# codegen-units = 1
# Abort on panic (faster than unwinding)
# panic = "abort"
# Strip symbols for smaller binary
strip = true
[profile.bench]
opt-level = 3
debug = true
lto = "fat"
